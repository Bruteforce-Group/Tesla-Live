name: Build Kivy UI snap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pi/snap/snapcraft.yaml"
      - ".github/workflows/snap-build.yml"
      - "pi/requirements.txt"
      - "pi/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build snap (destructive mode)
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          path: pi
          snapcraft-args: "--destructive-mode"

      - name: Upload snap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tesla-dashcam-ui-snap
          path: pi/*.snap
