name: Build Kivy UI snap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pi/snap/snapcraft.yaml"
      - ".github/workflows/snap-build.yml"
      - "pi/requirements.txt"
      - "pi/**"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build snap (destructive mode)
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        with:
          path: pi
          snapcraft-args: "--destructive-mode"

      - name: Upload snap artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tesla-dashcam-ui-snap
          path: pi/*.snap
